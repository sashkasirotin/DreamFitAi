services:
  # Backend Service
  - type: web
    name: dreamfitai-backend
    runtime: node
    plan: free
    rootDir: dreamFitAi-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dreamfitai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this in Render Dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set this in Render Dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set this in Render Dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set this in Render Dashboard

  # Frontend Service (Static Site)
  - type: web
    name: dreamfitai-frontend
    runtime: static
    plan: free
    rootDir: fittrack-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://dreamfitai-backend.onrender.com/api # Replace with your actual backend URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dreamfitai-db
    plan: free
    databaseName: fittrack
    user: fittrack_user
